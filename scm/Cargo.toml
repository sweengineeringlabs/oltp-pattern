[package]
name         = "oltp-pattern"
version      = "0.2.0"
edition      = "2021"
license      = "MIT OR Apache-2.0"
authors      = ["SWE Engineering Labs"]
repository   = "https://github.com/sweengineeringlabs/oltp-pattern"
rust-version = "1.98"
description  = "OLTP transactional record-store contract: single-key point CRUD plus atomic multi-key batch writes. Zero implementation, zero knowledge of any specific backend."
keywords     = ["oltp", "transactional", "store", "pattern", "swe"]
categories   = ["asynchronous"]

[package.metadata.arch]
application_type = "port"
service_type     = "oltp"

[lib]
name = "oltp_pattern"
path = "src/lib.rs"

[dependencies]
thiserror = "2.0"

[dev-dependencies]
tokio = { version = "1.52", features = ["rt-multi-thread", "macros"] }

[lints.rust]
unsafe_code  = "deny"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
